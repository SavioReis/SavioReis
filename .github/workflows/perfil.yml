name: Atualizar perfil (cartoes e cobrinha)

on:
  schedule:
    - cron: "17 */12 * * *" # a cada 12 horas
  workflow_dispatch: # botao "Run workflow"
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cartoes (estatisticas, linguagens, AE-MP)
        run: node .github/scripts/cartoes.mjs ${{ github.repository_owner }} dist AE-MP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#33F7F7

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
